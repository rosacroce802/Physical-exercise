<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คู่มือบริหาร — ท่าบริหารข้อและกล้ามเนื้อตามส่วนของร่างกาย</title>
<meta name="description" content="ค้นหาท่าบริหารข้อและกล้ามเนื้อตามสารบัญ จัดหมวดหมู่ตามส่วนของร่างกาย พร้อมภาพประกอบทีละขั้นตอน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.reader{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:312px 1fr;gap:0;align-items:start}

/* ---- Sidebar TOC ---- */
.toc{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;
  border-right:1px solid var(--line);padding:22px 14px 60px;background:linear-gradient(180deg,var(--paper),#FBF8F2)}
.toc-title{font-family:"Prompt";font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:0 10px 10px}
.toc-sec{margin-bottom:4px}
.toc-sec>button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;
  text-align:left;font-family:"Prompt";font-weight:500;font-size:15px;color:var(--ink);
  padding:10px 10px;border-radius:10px;transition:background .15s}
.toc-sec>button:hover{background:var(--primary-soft)}
.toc-sec>button .chev{margin-left:auto;width:16px;height:16px;stroke:var(--muted);transition:transform .2s;flex:0 0 auto}
.toc-sec.open>button .chev{transform:rotate(90deg)}
.toc-sec>button .num{width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--primary-deep);font-weight:600}
.toc-groups{display:none;padding:2px 0 8px 10px;margin-left:16px;border-left:2px solid var(--line)}
.toc-sec.open .toc-groups{display:block}
.toc-groups a{display:block;font-size:14px;color:#56655e;padding:7px 10px;border-radius:8px;
  font-family:"Sarabun";line-height:1.4;transition:background .14s,color .14s}
.toc-groups a:hover{background:#fff;color:var(--primary-deep)}
.toc-groups a.active{background:var(--primary);color:#fff;font-weight:500}
.toc-groups a .pg{float:right;font-size:11.5px;opacity:.7;margin-left:8px}

/* ---- Main panel ---- */
.panel{padding:26px 30px 40px;min-width:0}
.crumb{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}.crumb a:hover{color:var(--primary-deep)}
.panel h1{font-size:clamp(24px,3.2vw,32px);margin:0 0 4px}
.panel .grouptitle{font-family:"Prompt";font-weight:500;color:var(--accent-deep);font-size:18px;margin:0 0 6px}
.panel .intro{color:#54625b;font-size:16px;margin:0 0 18px;max-width:46em}
.pagecount{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);
  background:var(--paper-2);border:1px solid var(--line);padding:5px 12px;border-radius:999px;margin-bottom:20px}
.pagecount svg{width:15px;height:15px;stroke:var(--primary-deep)}

.imgstack{display:flex;flex-direction:column;gap:18px}
.imgcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);max-width:560px;margin:0 auto;width:100%}
.imgcard img{width:100%;height:auto;display:block;background:#f3f0e8;cursor:zoom-in}
.imgcard .cap{font-size:12.5px;color:var(--muted);padding:8px 14px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center}

.pager{display:flex;gap:12px;justify-content:space-between;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.pager a{flex:1;max-width:340px;border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 18px;
  background:var(--surface);transition:border-color .18s,box-shadow .18s;min-width:0}
.pager a:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.pager .dir{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.pager .dir svg{width:15px;height:15px;stroke:var(--primary-deep)}
.pager .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-family:"Prompt";font-weight:500;font-size:15px;color:var(--ink);margin-top:3px;line-height:1.35}
.pager a.next{text-align:right}.pager a.next .dir{justify-content:flex-end}
.pager a.disabled{opacity:.4;pointer-events:none}

/* mobile toc toggle */
.toc-mobilebar{display:none}

/* lightbox */
.lb{position:fixed;inset:0;z-index:200;background:rgba(20,30,28,.92);display:none;
  align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lb.show{display:flex}
.lb img{max-width:96vw;max-height:92vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .x{position:absolute;top:18px;right:20px;color:#fff;font-size:34px;cursor:pointer;line-height:1;
  background:none;border:none}

@media (max-width:980px){
  .reader{grid-template-columns:1fr}
  .toc{position:fixed;top:var(--header-h);left:0;bottom:0;width:300px;max-width:86vw;z-index:60;
    height:auto;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg);
    border-right:1px solid var(--line)}
  .toc.open{transform:translateX(0)}
  .toc-mobilebar{display:flex;align-items:center;gap:12px;position:sticky;top:var(--header-h);z-index:40;
    background:rgba(251,248,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:11px 18px}
  .toc-mobilebar button{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;
    border:none;border-radius:10px;padding:9px 15px;font-family:"Prompt";font-weight:500;font-size:14.5px;cursor:pointer}
  .toc-mobilebar button svg{width:18px;height:18px;stroke:#fff}
  .toc-mobilebar .now{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scrim{position:fixed;inset:0;background:rgba(20,30,28,.4);z-index:55;display:none}
  .scrim.show{display:block}
  .panel{padding:20px 18px 36px}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 4 4M4 4v3M4 4h3"/><path d="M17.5 6.5 20 4M20 4v3M20 4h-3"/><path d="M6.5 17.5 4 20M4 20v-3M4 20h3"/><path d="M17.5 17.5 20 20M20 20v-3M20 20h-3"/><circle cx="12" cy="12" r="3.4"/></svg></span>
      <span><b>คู่มือบริหารข้อ</b><span>ออกกำลังกายข้อ กระดูก กล้ามเนื้อ</span></span>
    </a>
    <nav class="nav-links" id="navlinks">
      <a href="index.html">หน้าแรก</a>
      <a href="guide.html" class="active">คู่มือบริหาร</a>
      <a href="health.html">บทความสุขภาพ</a>
    </nav>
    <button class="nav-toggle" id="navtoggle" aria-label="เปิดเมนู">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<div class="toc-mobilebar">
  <button id="opentoc"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>สารบัญ</button>
  <span class="now" id="mobilenow">เลือกหมวด</span>
</div>
<div class="scrim" id="scrim"></div>

<div class="reader">
  <aside class="toc" id="toc">
    <div class="toc-title">สารบัญ</div>
    <nav id="tocnav"></nav>
  </aside>

  <main class="panel" id="panel">
    <!-- injected -->
  </main>
</div>

<div class="lb" id="lb"><button class="x" id="lbx" aria-label="ปิด">&times;</button><img id="lbimg" alt=""></div>

<footer class="site-footer">
  <div class="wrap">
    <div class="foot-note" style="border:none;padding-top:6px">เนื้อหาเรียบเรียงจากหนังสือ “การออกกำลังกายและฝึกบริหารข้อและกล้ามเนื้อ” · ควรปรึกษาแพทย์หรือนักกายภาพบำบัดก่อนเริ่มออกกำลังกาย</div>
  </div>
</footer>

<script src="data.js"></script>
<script>
const pad=n=>String(n).padStart(3,'0');
const imgPath=n=>`pages/p-${pad(n)}.jpg`;

// mobile main nav
document.getElementById('navtoggle').addEventListener('click',()=>document.getElementById('navlinks').classList.toggle('open'));

// flatten views for prev/next
const VIEWS=[];
GUIDE_DATA.forEach(s=>s.groups.forEach((g,gi)=>VIEWS.push({sid:s.id,gi,sec:s,grp:g})));
const viewKey=(sid,gi)=>`${sid}-${gi}`;
const findView=key=>VIEWS.findIndex(v=>viewKey(v.sid,v.gi)===key);

// build sidebar
const tocnav=document.getElementById('tocnav');
GUIDE_DATA.forEach((s,si)=>{
  const sec=document.createElement('div');sec.className='toc-sec';sec.dataset.sid=s.id;
  const btn=document.createElement('button');
  btn.innerHTML=`<span class="num">${s.id==='intro'?'·':si}</span><span>${s.title}</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>`;
  btn.addEventListener('click',()=>sec.classList.toggle('open'));
  const gw=document.createElement('div');gw.className='toc-groups';
  s.groups.forEach((g,gi)=>{
    const a=document.createElement('a');a.href=`#${s.id}-${gi}`;a.dataset.key=viewKey(s.id,gi);
    const pg=g.pages.length>1?`${g.pages.length} หน้า`:`1 หน้า`;
    a.innerHTML=`${g.title}<span class="pg">${pg}</span>`;
    gw.appendChild(a);
  });
  sec.appendChild(btn);sec.appendChild(gw);tocnav.appendChild(sec);
});

const panel=document.getElementById('panel');
function render(key){
  let idx=findView(key);
  if(idx<0){ // maybe just a section id -> first group
    const s=GUIDE_DATA.find(x=>x.id===key);
    if(s) idx=findView(viewKey(s.id,0));
  }
  if(idx<0) idx=findView(viewKey('intro',0));
  const v=VIEWS[idx],s=v.sec,g=v.grp;
  const prev=VIEWS[idx-1],next=VIEWS[idx+1];

  const imgs=g.pages.map(p=>`
    <figure class="imgcard">
      <img loading="lazy" src="${imgPath(p)}" alt="${s.title} — ${g.title}" data-full="${imgPath(p)}">
      <figcaption class="cap"><span>${s.title}</span><span>หน้า ${p-12>0?(p-12):'—'}</span></figcaption>
    </figure>`).join('');

  panel.innerHTML=`
    <div class="crumb"><a href="index.html">หน้าแรก</a> › <a href="#${s.id}-0">${s.title}</a></div>
    <h1>${s.title}</h1>
    <p class="grouptitle">${g.title}</p>
    ${s.intro?`<p class="intro">${s.intro}</p>`:''}
    <span class="pagecount"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>${g.pages.length} หน้าภาพประกอบ · แตะที่ภาพเพื่อขยาย</span>
    <div class="imgstack">${imgs}</div>
    <nav class="pager">
      ${prev?`<a class="prev" href="#${viewKey(prev.sid,prev.gi)}"><span class="dir"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>ก่อนหน้า</span><span class="ttl">${prev.grp.title}</span></a>`:`<span class="prev disabled"></span>`}
      ${next?`<a class="next" href="#${viewKey(next.sid,next.gi)}"><span class="dir">ถัดไป<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span class="ttl">${next.grp.title}</span></a>`:`<span class="next disabled"></span>`}
    </nav>`;

  // active states
  document.querySelectorAll('.toc-groups a').forEach(a=>a.classList.toggle('active',a.dataset.key===viewKey(v.sid,v.gi)));
  document.querySelectorAll('.toc-sec').forEach(sec=>{
    if(sec.dataset.sid===v.sid){sec.classList.add('open');
      const act=sec.querySelector('a.active');
    }
  });
  document.getElementById('mobilenow').textContent=`${s.title} · ${g.title}`;
  window.scrollTo({top:0,behavior:'instant' in window?'auto':'auto'});
  closeToc();
  // bind zoom
  panel.querySelectorAll('.imgcard img').forEach(im=>im.addEventListener('click',()=>openLb(im.dataset.full)));
}

function go(){const h=location.hash.replace('#','')||'intro-0';render(h);}
window.addEventListener('hashchange',go);

// mobile toc open/close
const toc=document.getElementById('toc'),scrim=document.getElementById('scrim');
function closeToc(){toc.classList.remove('open');scrim.classList.remove('show');}
document.getElementById('opentoc').addEventListener('click',()=>{toc.classList.add('open');scrim.classList.add('show');});
scrim.addEventListener('click',closeToc);

// lightbox
const lb=document.getElementById('lb'),lbimg=document.getElementById('lbimg');
function openLb(src){lbimg.src=src;lb.classList.add('show');}
lb.addEventListener('click',()=>lb.classList.remove('show'));
document.getElementById('lbx').addEventListener('click',()=>lb.classList.remove('show'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('show');});

go();
</script>

<!-- เมนูด้านล่าง: กดกลับหน้าแรกได้ง่ายทุกหน้า -->
<nav class="bottomnav" aria-label="เมนูหลัก">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
    <span>หน้าแรก</span>
  </a>
  <a href="guide.html" class="active" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" /><path d="M19 3v18"/></svg>
    <span>คู่มือบริหาร</span>
  </a>
  <a href="health.html">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-12 2 7h6"/></svg>
    <span>บทความ</span>
  </a>
</nav>
</body>
</html>
